name: NVIDIA Official Metadata Sync

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (verify and report without writing catalog)"
        required: false
        type: boolean
        default: false

concurrency:
  group: official-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run baseline tests before sync
        run: |
          python -m unittest discover -s tests -v

      - name: Run Official Metadata Orchestrator
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m src.catalog.orchestrator --dry-run
          else
            python -m src.catalog.orchestrator
          fi

      - name: Run validation tests after sync
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Git diff safety whitelist
        run: |
          echo "=== Checking Modified Files ==="
          MODIFIED_FILES=$(git status --porcelain | awk '{print $2}')
          echo "$MODIFIED_FILES"
          
          # Enforce strict safety whitelist
          UNAUTHORIZED_CHANGES=0
          for file in $MODIFIED_FILES; do
            if [[ "$file" != "data/model_catalog.json" && "$file" != data/sources/nvidia_build/* ]]; then
              echo "::error::Unauthorized file modification detected: $file"
              UNAUTHORIZED_CHANGES=1
            fi
          done
          
          if [ "$UNAUTHORIZED_CHANGES" -eq 1 ]; then
            echo "::error::Pipeline modified files outside the approved whitelist. Aborting commit."
            exit 1
          fi

      - name: Commit and push catalog changes
        run: |
          if git diff --quiet data/model_catalog.json data/sources/nvidia_build/ 2>/dev/null; then
            echo "No metadata or snapshot changes to commit."
          else
            echo "Changes detected in official catalog or snapshots. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/model_catalog.json data/sources/nvidia_build/
            git commit -m "sync(catalog): update official NVIDIA metadata [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
