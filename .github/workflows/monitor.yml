      - name: Show collected data
        run: |
          echo "=================================="
          echo "Collected NVIDIA API model snapshot"
          echo "=================================="
          cat data/nvidia_api_models.json

      - name: Upload snapshot
        uses: actions/upload-artifact@v6
        with:
          name: nvidia-api-model-snapshot
          path: data/nvidia_api_models.json
          if-no-files-found: error
